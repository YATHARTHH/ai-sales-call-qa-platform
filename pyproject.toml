[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-sales-call-qa-platform"
version = "0.1.0"
description = "SalesCall QA: Evidence-Driven Post-Call Compliance & QA Automation Platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Yatharth Singhai", email = "yatharthsinghai7@gmail.com" }
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "redis>=5.0.4",
    "boto3>=1.34.100",
    "structlog>=24.1.0",
    "prometheus-client>=0.20.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.5",
    "mypy>=1.10.0",
    "types-redis>=4.6.0.20240425",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["packages*", "apps*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "C",    # flake8-comprehensions
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
]
ignore = ["B008", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["packages", "apps"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["migrations/versions/.*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
